name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:                  # PRs run smoke tests only
  schedule: [{ cron: '0 2 * * *' }]   # nightly: full regression
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright test --grep @smoke
          else
            npx playwright test
          fi
        env:
          SAUCE_PASS: ${{ secrets.SAUCE_PASS || 'secret_sauce' }}
          BOOKER_USER: ${{ secrets.BOOKER_USER || 'admin' }}
          BOOKER_PASS: ${{ secrets.BOOKER_PASS || 'password123' }}
      - if: always()
        run: npm run report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          if-no-files-found: ignore
          path: |
            playwright-report
            dashboard
