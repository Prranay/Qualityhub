<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QualityHub - Redirecting to QA Platform</title>
  <script>
    // GitHub Pages repository paths are case-sensitive.
    // If user accesses /qualityhub or an invalid route, redirect to /Qualityhub/
    const path = window.location.pathname;
    if (path.toLowerCase().includes('/qualityhub')) {
      window.location.replace('/Qualityhub/');
    } else {
      window.location.replace('./');
    }
  </script>
  <style>
    :root {
      --bg-white: #ffffff;
      --card-beige: #f5efe6;
      --border-beige: #e8ded1;
      --aqua-primary: #0891b2;
      --text-black: #0f172a;
      --text-grey: #64748b;
    }
    body {
      background: var(--bg-white);
      color: var(--text-black);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .redirect-card {
      background: var(--card-beige);
      border: 1px solid var(--border-beige);
      border-radius: 12px;
      padding: 32px 40px;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }
    .badge {
      display: inline-block;
      background: var(--bg-white);
      color: var(--aqua-primary);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
      border: 1px solid var(--border-beige);
    }
    h2 {
      margin: 0 0 10px;
      font-size: 1.4rem;
    }
    p {
      color: var(--text-grey);
      font-size: 0.9rem;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      background: var(--aqua-primary);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 10px 22px;
      border-radius: 8px;
      transition: opacity 0.2s;
    }
    a.btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="badge">QualityHub QA Studio</div>
    <h2>Redirecting to E-Commerce QA Platform...</h2>
    <p>Please wait while we transfer you to the test automation environment.</p>
    <a href="/Qualityhub/" class="btn">Open QualityHub Studio</a>
  </div>
</body>
</html>
