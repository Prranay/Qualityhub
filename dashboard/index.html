<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QualityHub test report</title>
<style>
:root{--bg:#ffffff;--card:#dcf4f1;--ink:#0b3a47;--mute:#35676f;--pass:#0e8a87;--fail:#d7b27a;--skip:#f1e6cc;--hl:#6fd8d0;--line:#a9e0db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b3d47;--card:#0f5260;--ink:#f7f1e3;--mute:#9fd0d3;--pass:#3fd0cb;--fail:#e6cc9d;--skip:#ffffff;--hl:#f0e2c4;--line:#1d6575}}
:root[data-theme="dark"]{--bg:#0b3d47;--card:#0f5260;--ink:#f7f1e3;--mute:#9fd0d3;--pass:#3fd0cb;--fail:#e6cc9d;--skip:#ffffff;--hl:#f0e2c4;--line:#1d6575}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:48px 20px 64px}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 40px;max-width:60ch}
.total{font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:600;margin:0 0 14px}
.bar{display:flex;height:30px;border-radius:15px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.p{background:var(--pass)}.f{background:var(--fail)}.s{background:var(--skip)}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0 40px;color:var(--mute);font-size:.9rem}
.legend span{background:none}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
.legend .p{--c:var(--pass)}.legend .f{--c:var(--fail)}.legend .s{--c:var(--skip)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
button{font:inherit;color:var(--ink);background:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
button[aria-pressed="true"]{background:var(--hl);border-color:var(--hl);color:#0b3a47;font-weight:600}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;overflow:hidden}
li{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .bar{height:10px;border-radius:5px}
.n{font-weight:600}.c{color:var(--mute);font-size:.9rem;text-align:right;min-width:110px}
.bug{background:var(--fail);color:#0b3a47;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:6px}
.note{color:var(--mute);font-size:.85rem;margin-top:28px}
code{background:var(--card);padding:2px 6px;border-radius:5px}
@media(max-width:560px){li{grid-template-columns:1fr auto}li .bar{grid-column:1/-1;order:3}}
</style>
</head>
<body>
<main>
  <h1>QualityHub</h1>
  <p class="sub">Latest run of the JSON-driven UI and API scenarios.</p>
  <p class="total" id="total"></p>
  <div class="bar" id="bar" role="img"></div>
  <div class="legend"><span class="p">Passed</span><span class="f">Failed</span><span class="s">Skipped</span></div>
  <div class="tabs">
    <button aria-pressed="true" data-f="all">All suites</button>
    <button aria-pressed="false" data-f="fail">Failing only</button>
  </div>
  <ul id="list"></ul>
  <p class="note">Generated by <code>npm run report</code> from the latest test run.</p>
</main>
<script type="module">
const suites=await fetch("summary.json").then(r=>r.json()).catch(()=>[["No run yet",0,0,0]]);
const $=id=>document.getElementById(id);
const seg=(cls,n,t)=>{const i=document.createElement("i");i.className=cls;i.style.width=n/t*100+"%";return i};
function bar(el,p,f,s){const t=p+f+s;[["p",p],["f",f],["s",s]].forEach(([c,n])=>n&&el.append(seg(c,n,t)))}
const sum=i=>suites.reduce((a,s)=>a+s[i],0), P=sum(1), F=sum(2), S=sum(3);
$("total").textContent=`${P} of ${P+F+S} tests passed`;
bar($("bar"),P,F,S);$("bar").setAttribute("aria-label",`${P} passed, ${F} failed, ${S} skipped`);
function render(f){
  $("list").replaceChildren(...suites.filter(s=>f==="all"||s[2]).map(([name,p,fl,sk,bug])=>{
    const li=document.createElement("li"),n=document.createElement("span"),b=document.createElement("div"),c=document.createElement("span");
    n.className="n";n.textContent=name;b.className="bar";bar(b,p,fl,sk);c.className="c";
    c.textContent=`${p} passed`+(fl?`, ${fl} failed`:"")+(sk?`, ${sk} skipped`:"");
    if(bug){const a=document.createElement("span");a.className="bug";a.textContent=` ${bug}`;c.append(a)}
    li.append(n,b,c);return li}));
}
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));render(b.dataset.f)});
render("all");
</script>
</body>
</html>
